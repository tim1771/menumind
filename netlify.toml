[build]
  publish = "."
  functions = "netlify/functions"
  command = "node scripts/build-blog.js && node scripts/build-cities.js"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["groq-sdk"]

[functions."analyze-menu"]
  timeout = 90

# Daily drip sender — runs at 14:00 UTC (~10am ET, 7am PT).
[functions."send-drip"]
  schedule = "0 14 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'"
